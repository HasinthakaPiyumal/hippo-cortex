# =============================================================================
# HippoCortex — Stage 1 / Split-CIFAR100
# =============================================================================
# DO NOT change values mid-experiment. All benchmark runs in Paper 1 use
# exactly these settings. Override on the CLI if you need a sweep:
#   python run.py training.lr=3e-4
# Every override is logged to W&B so results stay traceable.
# =============================================================================

# -----------------------------------------------------------------------------
# Reproducibility
# -----------------------------------------------------------------------------
seed: 0
# Seed 0, as the baseline runs (Inf-SSM protocol, seeds 0/10/100): the authors released the
# task-0 checkpoint for seed 0 only (model.backbone.checkpoint_path: hf).

# -----------------------------------------------------------------------------
# Dataset
# -----------------------------------------------------------------------------
dataset:
  name: split_cifar100
  root: data/cifar100          # relative to repo root; gitignored

  n_tasks: 10                  # tasks to run (< 100 / n_classes_per_task stops early, for smoke runs)
  n_classes_per_task: 10       # 10 × 10 = 100 classes (Inf-SSM protocol); must divide 100
  class_order: natural         # natural: task t = classes 10t..10t+9 (the task-0 checkpoint
                               #   was trained on classes 0-9); random: seeded permutation
  normalize: imagenet          # imagenet mean/std, as the Vim-small checkpoints expect; or cifar

  # Data loading
  num_workers: 4               # DataLoader worker threads; set to 0 on Windows
  pin_memory: true             # faster GPU transfer; set false if RAM is tight

  # Augmentation: cifar (= true) random crop + flip at 32x32, train only | none (= false) |
  # inf_ssm: the Inf-SSM baselines' transforms (train: 224 RandAugment + colour jitter + random
  # erasing, ImageNet stats; eval: resize 256 + centre crop 224, CIFAR stats). normalize is
  # ignored with inf_ssm. Mixup / cutmix / label smoothing are not implemented.
  augment: cifar
  image_size: 32               # native CIFAR-100 resolution

# -----------------------------------------------------------------------------
# Model architecture
# -----------------------------------------------------------------------------
model:
  # Backbone: Vim-small — the network of both baselines (Inf-SSM, and Mamba-CL under the
  # Inf-SSM protocol), so HippoCortex sits in the same table. Built from
  # baselines/mamba-cl/utils/vim_mamba.py; only the head, x_proj, out_proj.weight, A_log and
  # A_b_log are fine-tuned (Mamba-CL --training_string).
  mamba_d_model: 384           # feature width = encode_image(pre_logits=True); also the SWR
                               # generator / null-space projector dimension (768 for defocus_base)
  backbone:
    arch: vim_small            # vim_small | defocus_base (Mamba-CL's own protocol, 768-d)
    checkpoint_path: hf        # hf = the authors' task-0 checkpoint (ileening0022/Inf-SSM,
                               #   <hf_dir>/task_0_checkpoint_seed_<seed>.pth); or a local path
                               #   (defocus_base: checkpoints/defocus_mamba_base_cls.pth)
    hf_dir: cifar100_10task
    config_path: null          # defocus_base only; null → baselines/mamba-cl/utils/defocus_mamba_base.yaml
    checkpoint_url: https://github.com/OpenGVLab/De-focus-Attention-Networks/releases/download/v1.0/defocus_mamba_base_cls.pth
    head_mode: shared          # shared: one 100-way head (Inf-SSM protocol; the task-0 head is
                               #   loaded from the checkpoint); per_task: one head per task
    grad_ckpt: false           # recompute each Vim block in backward: less memory, ~30% slower
    image_size: 224            # CIFAR 32x32 inputs are bicubic-resized to this in the backbone

  # UNUSED since the De-focus backbone replaced the toy Mamba stack. Kept so older
  # overrides and tooling keep parsing; nothing reads them.
  mamba_n_layers: 4
  mamba_d_state: 16
  mamba_expand: 2
  mamba_d_conv: 4
  mamba_dropout: 0.0

  # Conditional VAE (SWR generator)
  cvae_latent_dim: 64          # bottleneck — compressed memory trace width
  cvae_hidden_dim: 512         # MLP hidden size in encoder and decoder
  cvae_n_layers: 2             # MLP depth in encoder / decoder

  # Null-space projector
  nsp_rank_budget: 200         # max number of singular vectors kept per task;
                               # total basis U has shape (d_model, rank_budget)
                               # Mamba-CL uses 200 for CIFAR-100

# -----------------------------------------------------------------------------
# Training — three phases per task
# -----------------------------------------------------------------------------
# Total epochs per task = epochs_warmup + epochs_joint + epochs_consolidation
# = 5 + 10 + 3 = 18 epochs / task × 9 trained tasks (task 0 comes from the checkpoint)

training:
  # Task 0 comes trained in the task-0 checkpoint (as for the baselines): false runs only
  # the sleep phase for it. Set true when starting from untrained weights.
  train_first_task: false

  # Phase 1 — Warmup
  # Pure cross-entropy on the current task. No replay, no projection.
  # Warms the task head and lets the backbone specialise before gradients
  # are constrained by the null-space projector.
  epochs_warmup: 5

  # Phase 2 — Joint
  # CE on current task + ELBO on SWR-generated past hidden states.
  # All backbone gradients projected through P = I − UUᵀ.
  epochs_joint: 10

  # Phase 3 — Consolidation (sleep)
  # Update StatsBuffer (µ, σ²) and extend null-space basis U.
  # No weight updates to backbone — pure bookkeeping + VAE fine-tune.
  epochs_consolidation: 3

  # Optimiser (backbone — Phase 1 and 2)
  optimizer: adamw
  lr: 2.0e-4                   # as the shared-head Mamba-CL baseline (--optim mamba_cl)
  weight_decay: 5.0e-5         # as the shared-head Mamba-CL baseline
  head_weight_decay: 0.0       # the shared head keeps old classes; decay would erase them
  betas: [0.9, 0.999]          # AdamW momentum terms (PyTorch defaults)

  # The head trains at lr × head_lr_scale = 2e-4 × 50 = 1e-2, as Mamba-CL (--lr_scale 50).
  head_lr_scale: 50.0

  # Mixed precision, CUDA only: fp16 autocast + GradScaler (Mamba-CL --use_amp).
  use_amp: true

  # Optimiser (CVAE — Phase 3 only)
  cvae_lr: 3.0e-4
  cvae_weight_decay: 0.0
  cvae_batch_size: 256         # current-task hidden states per CVAE step (same count replayed per old task)
  replay_samples: 512          # synthetic hidden states drawn per earlier task in Phase 3
  consolidate: true            # false skips Phase 3 (buffer + projector stay empty)

  # Learning rate scheduler (cosine, per task)
  lr_scheduler: cosine         # "cosine" | "constant"
  lr_min: 1.0e-5               # floor for cosine schedule

  # Data
  batch_size: 64               # matches Mamba-CL / Inf-SSM for fair comparison

  # Gradient clipping (Phase 2 only, after projection)
  grad_clip: 1.0               # max gradient norm; null = disabled

  # ELBO weighting (Phase 2)
  kl_weight: 1.0e-3            # β in β-VAE loss: L = CE + β × KL
                               # start small — ramp up once CVAE is stable

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
eval:
  mode: class_il               # class_il: heads of all seen tasks joined, argmax over every
                               #   seen class (Mamba-CL's metric; use this for comparisons)
                               # task_il:  each task scored with its own head (task id given)
  eval_after_each_task: true   # compute acc on all seen tasks after each task
  eval_batch_size: 256         # larger batch is fine — no gradients

# -----------------------------------------------------------------------------
# Logging & checkpointing
# -----------------------------------------------------------------------------
logging:
  use_wandb: false             # set true (and WANDB_API_KEY env var) to enable
  wandb_project: hippocortex-stage1
  wandb_entity: null           # null → uses your default W&B entity
  run_name: null               # null → auto-generated by W&B
  save_dir: results/stage1_split_cifar100

  save_checkpoint: true        # save model weights after each task
  checkpoint_dir: results/stage1_split_cifar100/checkpoints

  log_every_n_batches: 50      # loss logging granularity inside an epoch
